<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2306060a'/%3E%3Cpath d='M8 2.5 13.5 13H2.5Z' stroke='%23fff' stroke-width='1.3' fill='none'/%3E%3Cpath d='M9.5 8 15 6.5' stroke='%23ff4d6d'/%3E%3Cpath d='M9.8 8.6 15 9' stroke='%2346e0ff'/%3E%3Cpath d='M10 9.2 15 11.5' stroke='%23a66bff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ft.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="room"></div>
    <canvas id="field"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>

    <!-- shared by every knob: the lit cap -->
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <defs>
        <radialGradient id="ftCap" cx="0.38" cy="0.3" r="0.8">
          <stop offset="0" stop-color="#3a3a46" />
          <stop offset="0.55" stop-color="#16161e" />
          <stop offset="1" stop-color="#08080c" />
        </radialGradient>
        <linearGradient id="spectrum" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#ff4d6d" />
          <stop offset="0.2" stop-color="#ffa53d" />
          <stop offset="0.4" stop-color="#e8ff4a" />
          <stop offset="0.6" stop-color="#46ffb0" />
          <stop offset="0.8" stop-color="#46c8ff" />
          <stop offset="1" stop-color="#a66bff" />
        </linearGradient>
      </defs>
    </svg>

    <div id="app">
      <header class="bar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 40 32" aria-hidden="true">
            <path class="ray-in" d="M0 17 L14 16" />
            <path class="glass" d="M17 3 L29 27 H5 Z" />
            <path class="out r" d="M21 15 L40 9" />
            <path class="out y" d="M21.4 16 L40 14" />
            <path class="out g" d="M21.8 17 L40 19" />
            <path class="out b" d="M22.2 18 L40 24" />
            <path class="out v" d="M22.6 19 L40 29" />
          </svg>
          <div>
            <h1>PRISM</h1>
            <span class="sub">spectral synth <b>·</b> ft</span>
          </div>
        </div>

        <div class="presets">
          <button id="prev" class="round" title="previous preset">
            <svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
          </button>
          <button id="browse" title="browse the presets (`)">
            <span class="tag" id="preset-tag">summit</span>
            <span class="nm" id="preset-name">First Steps</span>
          </button>
          <button id="next" class="round" title="next preset">
            <svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
          </button>
          <div class="actions">
            <button id="spore" class="chip" title="refract the current patch a little">
              <svg viewBox="0 0 16 16"><path d="M8 2 13 13H3Z" /><path d="M9 8l5-2M9.5 9l4.5 1" /></svg>
              refract
            </button>
            <button id="save" class="chip" title="save this sound as a preset (⌘S)">
              <svg viewBox="0 0 16 16"><path d="M3 2.5h8l2.5 2.5v8.5h-10.5Z" /><path d="M5.5 2.5v3.5h4.5V2.5M5.5 13.5v-4h5v4" /></svg>
              save
            </button>
            <button id="copy" class="chip" title="copy the patch JSON to the clipboard">
              <svg viewBox="0 0 16 16"><path d="M4 3.5 1.5 8 4 12.5M12 3.5 14.5 8 12 12.5M9.5 2.5l-3 11" /></svg>
              copy
            </button>
          </div>
        </div>

        <div class="scopewrap" title="the output"><canvas id="scope"></canvas></div>

        <div class="status">
          <div class="io">
            <label class="master" title="master volume">
              <svg viewBox="0 0 16 16"><path d="M2.5 6h2.2L8 3v10L4.7 10H2.5Z" /><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.8a6 6 0 0 1 0 8.4" /></svg>
              <input id="master" type="range" min="0" max="1" step="0.01" value="0.7" />
            </label>
            <div class="midi" title="MIDI input">
              <span id="midi-led" class="led"></span>
              <select id="midi-port"><option value="all">all MIDI inputs</option></select>
            </div>
          </div>
          <div class="io">
            <span id="stats" class="muted"></span>
            <button id="panic" class="chip" title="stop all sound">panic</button>
          </div>
          <div class="power-wrap">
            <button id="start" class="power" title="turn the light on">
              <svg viewBox="0 0 16 16"><path d="M8 2v5.5" /><path d="M4.6 4.3a5 5 0 1 0 6.8 0" /></svg>
            </button>
            <span id="start-label">start</span>
          </div>
        </div>
      </header>

      <section id="macros" class="macros"></section>

      <nav id="tabs" class="tabs"><span class="tab-light"></span></nav>
      <main id="panels"></main>

      <footer>
        <canvas id="keyboard"></canvas>
        <div class="hint muted">
          <kbd>A</kbd>–<kbd>'</kbd> <kbd>Z</kbd>–<kbd>/</kbd> play · <kbd>←</kbd><kbd>→</kbd> octave <span id="octave">C4</span> · <kbd>Shift</kbd> louder · <kbd>Space</kbd> sustain · <kbd>1</kbd>–<kbd>4</kbd> views · <kbd>`</kbd> presets · drag knobs, <kbd>Shift</kbd> fine, double-click resets · coloured arcs are modulation
        </div>
      </footer>
    </div>

    <!-- preset browser -->
    <div id="browser" class="browser" hidden>
      <div class="sheet">
        <div class="head">
          <h2>Presets</h2>
          <input id="browser-search" type="search" placeholder="search…" autocomplete="off" spellcheck="false" />
          <button id="browser-save" class="chip" title="save the current sound (⌘S)">save current</button>
          <button id="browser-close" class="chip" title="close (Esc)">esc</button>
        </div>
        <form id="savebar" class="savebar" hidden>
          <label for="save-name">save as</label>
          <input id="save-name" type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="name your sound" />
          <button id="save-ok" type="submit" class="chip primary">save</button>
          <button id="save-cancel" type="button" class="chip">cancel</button>
          <span id="save-msg" class="msg"></span>
        </form>
        <div class="split">
          <nav id="browser-side" class="side"></nav>
          <div id="browser-list" class="list"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
